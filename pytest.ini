[pytest]
testpaths = tests

# The game modules live at the repository root rather than in a package, so the
# root has to be importable. conftest.py handles that; this keeps pytest's own
# rootdir detection anchored here too.
addopts = -ra --strict-markers

markers =
    needs_engine: test drives the real Stockfish binary; skipped automatically when it is absent.

# NOTE: PYTHONHASHSEED cannot be set from this file -- CPython reads it before
# the interpreter starts. Set it in the environment when you need reproducible
# set()/dict ordering while chasing an ordering bug:
#
#     Windows PowerShell:   $env:PYTHONHASHSEED = "0"; pytest
#     bash:                 PYTHONHASHSEED=0 pytest
#
# CI pins it to 0 (see .github/workflows/tests.yml) so ordering-sensitive
# failures are reproducible rather than intermittent.
